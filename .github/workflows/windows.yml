name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/build-installer.ps1 -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: discard-windows-x64
          path: target/distribution/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: discard-windows-x64
          path: distribution
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          distribution/Discard-Setup.exe
          distribution/Discard.exe
          distribution/SHA256SUMS.txt
          --verify-tag --generate-notes
          --title "Discard $RELEASE_TAG"
          --notes 'Download Discard-Setup.exe to install for your Windows account. Setup installs Microsoft Edge WebView2 if needed (Internet required). This early version hosts Discord Web; voice, video and screen sharing have not been runtime-validated. Binaries are not code-signed.'
