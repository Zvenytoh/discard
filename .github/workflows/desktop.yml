name: Desktop
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_BUILD: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust components and native target
        id: rust
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "$RUST_TARGET"
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$RUST_TARGET"
          echo "fingerprint=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/release
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.fingerprint }}-
      - name: Verify package version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "discard"))')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "DISCARD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install reviewed Tauri CLI
        if: env.PACKAGE_BUILD == 'true'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-tauri-cli.ps1 -Target $env:RUST_TARGET
      - name: Build Windows application
        if: runner.os == 'Windows' && env.PACKAGE_BUILD == 'true'
        run: cargo tauri build --no-bundle -- --locked
      - name: Install Inno Setup
        if: runner.os == 'Windows' && env.PACKAGE_BUILD == 'true'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Package Windows installer and portable executable
        if: runner.os == 'Windows' && env.PACKAGE_BUILD == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/build-installer.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Sign Windows updater installer
        if: runner.os == 'Windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The updater signing key secret is required for a release.' }
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          cargo tauri signer sign --app-version $env:DISCARD_VERSION target/distribution/Discard-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Updater installer signing failed.' }
          if (-not (Test-Path -LiteralPath target/distribution/Discard-Setup.exe.sig)) { throw 'Updater signature was not produced.' }
          $assets = Get-ChildItem -LiteralPath target/distribution -File | Where-Object Name -ne SHA256SUMS.txt | Sort-Object Name
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $checksums | Set-Content -LiteralPath target/distribution/SHA256SUMS.txt -Encoding ascii
      - name: Verify Windows deliverables
        if: runner.os == 'Windows' && env.PACKAGE_BUILD == 'true'
        run: |
          test -s target/distribution/Discard-Setup.exe
          test -s target/distribution/Discard.exe
          test -s target/distribution/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        if: env.PACKAGE_BUILD == 'true'
        with:
          name: discard-${{ matrix.platform }}
          path: target/distribution/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: discard-windows-x64
          path: artifacts/discard-windows-x64
      - name: Select validated packages and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          mkdir distribution
          cp artifacts/discard-windows-x64/Discard-Setup.exe distribution/
          cp artifacts/discard-windows-x64/Discard.exe distribution/
          cp artifacts/discard-windows-x64/Discard-Brand-Kit.zip distribution/
          cp artifacts/discard-windows-x64/Discard-Setup.exe.sig distribution/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          signature = Path("distribution/Discard-Setup.exe.sig").read_text(encoding="utf-8").strip()
          if not signature:
              raise SystemExit("Updater installer signature is empty")
          manifest = {
              "version": tag.removeprefix("v"),
              "platforms": {"windows-x86_64": {
                  "signature": signature,
                  "url": f"https://github.com/Zvenytoh/discard/releases/download/{tag}/Discard-Setup.exe",
              }},
          }
          Path("distribution/latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          printf '%s\n' 'Windows x64 release with the Comete brand identity across application, tray, installer and shortcuts. Discard-Brand-Kit.zip includes editable logos, icons, banners and brand guidance. The installer is signed for Discard startup updates; executables are not Authenticode-signed. macOS and Linux packages are not included in this release.' > release-notes.md
          cd distribution
          sha256sum -- Discard* latest.json > SHA256SUMS.txt
      - name: Publish one release after all native builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" distribution/* --verify-tag --generate-notes --title "Discard $RELEASE_TAG" --notes-file release-notes.md
