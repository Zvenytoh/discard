name: Desktop
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Install Rust components and native target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "$RUST_TARGET"
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$RUST_TARGET"
      - name: Verify package version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "discard"))')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "DISCARD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Install reviewed Tauri CLI
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: ./scripts/install-tauri-cli.ps1 -Target $env:RUST_TARGET
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: cargo tauri build --no-bundle -- --locked
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Package Windows installer and portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/build-installer.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Sign Windows updater installer
        if: runner.os == 'Windows' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The updater signing key secret is required for a release.' }
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          cargo tauri signer sign --app-version $env:DISCARD_VERSION target/distribution/Discard-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Updater installer signing failed.' }
          if (-not (Test-Path -LiteralPath target/distribution/Discard-Setup.exe.sig)) { throw 'Updater signature was not produced.' }
          $assets = Get-ChildItem -LiteralPath target/distribution -File | Where-Object Name -ne SHA256SUMS.txt | Sort-Object Name
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $checksums | Set-Content -LiteralPath target/distribution/SHA256SUMS.txt -Encoding ascii
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo tauri build --bundles deb,appimage -- --locked
          mkdir -p target/distribution
          debs=(target/release/bundle/deb/*.deb)
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1 && test -f "${debs[0]}"
          test "${#images[@]}" -eq 1 && test -f "${images[0]}"
          cp "${debs[0]}" "target/distribution/Discard_${DISCARD_VERSION}_linux-x64.deb"
          cp "${images[0]}" "target/distribution/Discard_${DISCARD_VERSION}_linux-x64.AppImage"
      - name: Package macOS (unsigned experimental unless signing credentials exist)
        if: runner.os == 'macOS'
        env:
          RUST_TARGET: ${{ matrix.target }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
        run: |
          signed=false
          signing_dir=$(mktemp -d "$RUNNER_TEMP/discard-signing.XXXXXX")
          keychain="$signing_dir/build.keychain-db"
          cleanup() {
            if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
            rm -f "$signing_dir/certificate.p12"
            rmdir "$signing_dir"
          }
          trap cleanup EXIT
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application:'* ]]
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$signing_dir/certificate.p12"
            keychain_password=$(openssl rand -hex 24)
            echo "::add-mask::$keychain_password"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$signing_dir/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            signed=true
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY='-'
            echo 'No complete signing credentials: experimental unsigned/ad-hoc macOS CI artifact only.'
          fi
          cargo tauri build --target "$RUST_TARGET" --bundles dmg -- --locked
          mkdir -p target/distribution
          images=(target/"$RUST_TARGET"/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1 && test -f "${images[0]}"
          if [[ "$signed" == true ]]; then
            apps=(target/"$RUST_TARGET"/release/bundle/macos/*.app)
            test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
            codesign --verify --deep --strict "${apps[0]}"
            xcrun stapler validate "${apps[0]}"
            suffix=''
          else
            suffix='-unsigned-experimental'
          fi
          cp "${images[0]}" "target/distribution/Discard_${DISCARD_VERSION}_${PACKAGE_PLATFORM}${suffix}.dmg"
      - name: Verify Windows deliverables
        if: runner.os == 'Windows'
        run: |
          test -s target/distribution/Discard-Setup.exe
          test -s target/distribution/Discard.exe
          test -s target/distribution/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: discard-${{ matrix.platform }}
          path: target/distribution/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: discard-windows-x64
          path: artifacts/discard-windows-x64
      - name: Select validated packages and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          mkdir distribution
          cp artifacts/discard-windows-x64/Discard-Setup.exe distribution/
          cp artifacts/discard-windows-x64/Discard.exe distribution/
          cp artifacts/discard-windows-x64/Discard-Setup.exe.sig distribution/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          signature = Path("distribution/Discard-Setup.exe.sig").read_text(encoding="utf-8").strip()
          if not signature:
              raise SystemExit("Updater installer signature is empty")
          manifest = {
              "version": tag.removeprefix("v"),
              "platforms": {"windows-x86_64": {
                  "signature": signature,
                  "url": f"https://github.com/Zvenytoh/discard/releases/download/{tag}/Discard-Setup.exe",
              }},
          }
          Path("distribution/latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          printf '%s\n' 'Windows x64 release. The installer is signed for Discard startup updates; executables are not Authenticode-signed. The Windows native title bar matches the supplied Discord reference. macOS and Linux packages are not included in this release.' > release-notes.md
          cd distribution
          sha256sum -- Discard* latest.json > SHA256SUMS.txt
      - name: Publish one release after all native builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" distribution/* --verify-tag --generate-notes --title "Discard $RELEASE_TAG" --notes-file release-notes.md
