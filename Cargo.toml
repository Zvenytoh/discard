[package]
name = "discard"
version = "0.2.1"
edition = "2021"
description = "A focused desktop home for Discord Web, built with Rust and Tauri"
repository = "https://github.com/Zvenytoh/discard"
readme = "README.md"
publish = false

[dependencies]
serde_json = "1"
url = "2.5"
tauri = { version = "=2.12.4", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.3"
tempfile = "3"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
