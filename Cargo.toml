[package]
name = "discard"
version = "0.2.0"
edition = "2021"
description = "A focused desktop home for Discord Web, built with Rust and Tauri"
repository = "https://github.com/Zvenytoh/discard"
readme = "README.md"
publish = false

[dependencies]
url = "2.5"
tauri = { version = "=2.12.4", features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
