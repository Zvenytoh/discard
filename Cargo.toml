[package]
name = "discard"
version = "0.1.0"
edition = "2021"
description = "A lightweight Windows host for Discord Web using Rust, Win32 and WebView2"
repository = "https://github.com/Zvenytoh/discard"
readme = "README.md"
publish = false

[dependencies]
url = "2.5"
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
